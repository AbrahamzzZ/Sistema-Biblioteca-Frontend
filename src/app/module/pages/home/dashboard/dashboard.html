<h1>Dashboard</h1>

<p>Resumem general del sistema de biblioteca</p>

<div class="stats-container">
  <app-stat-card
    title="Usuarios Registrados"
    [count]="users.length"
    icon="people">
  </app-stat-card>

  <app-stat-card
    title="Prestamos Activos"
    [count]="filteredUsers.length"
    icon="check_circle">
  </app-stat-card>

  <app-stat-card
    title="Prestamos Vencidos"
    [count]="filteredUsers.length"
    icon="check_circle">
  </app-stat-card>
</div>

<div class="content">
    <app-detail-card class="card">
    </app-detail-card>
</div>
