<h1>Gestión de Usuarios</h1>

<div class="stats-container">
  <app-stat-card
    title="Usuarios totales"
    [count]="users.length"
    icon="people">
  </app-stat-card>

  <app-stat-card
    title="Usuarios activos"
    [count]="filteredUsers.length"
    icon="check_circle">
  </app-stat-card>
</div>

<div class="actions">
  <app-search-bar
    [options]="searchOptions"
    (search)="onSearch($event)">
  </app-search-bar>

  <app-button
    label="Registrar usuario"
    icon="add"
    color="primary"
    (clickEvent)="onCreateUser()">
  </app-button>
</div>

<app-data-table
  [columns]="columns"
  [data]="filteredUsers"
  (edit)="onEditUser($event)"
  (delete)="onAskDelete($event)">
</app-data-table>

@if(showDeleteDialog){
  <app-dialog
    title="Eliminar usuario"
    message="¿Deseas eliminar el usuario?"
    [itemName]="selectedUser?.name"
    (confirm)="confirmDelete()"
    (cancelDelete)="cancelDelete()">
  </app-dialog>
}

@if(showUserModal){
  <app-modal
    (close)="closeUserModal()">

    <app-form
      [user]="editingUser"
      (cancel)="closeUserModal()"
      (save)="onSaveUser($event)">
    </app-form>

  </app-modal>
}
