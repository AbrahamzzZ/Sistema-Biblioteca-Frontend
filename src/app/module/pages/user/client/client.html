<h1>Gestión de Usuarios</h1>

<div class="stats-container">
  <app-stat-card
    title="Usuarios totales"
    [count]="users.length"
    icon="people">
  </app-stat-card>

  <app-stat-card
    title="Usuarios activos"
    [count]="usuariosActivos"
    icon="check_circle">
  </app-stat-card>

  <app-stat-card
    title="Usuarios inactivos"
    [count]="usuariosInactivos"
    icon="remove_circle_outline">
  </app-stat-card>
</div>

<div class="actions">
  <app-search-bar
    [options]="searchOptions"
    (search)="onSearch($event)">
  </app-search-bar>

  <app-button
    label="Registrar usuario"
    icon="add"
    color="primary"
    (clickEvent)="onCreateUser()">
  </app-button>
</div>

<app-data-table
  [columns]="columns"
  [data]="filteredUsers"
  (edit)="onEditUser($event)"
  (toggle)="onAskToggle($event)">
</app-data-table>

@if(showConfirmDialog){
  <app-dialog
    [title]="dialogTitle"
    [message]="dialogMessage"
    [itemName]="selectedUser?.nombre_Completo"
    (confirm)="confirmToggle()"
    (cancelDelete)="cancelDialog()">
  </app-dialog>
}

@if(showUserModal){
  <app-modal (close)="closeUserModal()">
    <app-form
      [user]="editingUser"
      (cancel)="closeUserModal()"
      (save)="onSaveUser($event)">
    </app-form>
  </app-modal>
}
