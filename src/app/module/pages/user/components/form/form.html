<app-card [title]="user ? 'Editar usuario' : 'Registrar usuario'">

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

  <app-input-field
    label="Nombre completo"
    [control]="form.controls.nombreCompleto">
  </app-input-field>

  <app-input-field
    label="Cédula"
    [control]="form.controls.cedula">
  </app-input-field>

  <app-input-field
    label="Correo"
    type="email"
    [control]="form.controls.correoElectronico">
  </app-input-field>

  <app-input-field
    label="Dirección"
    [control]="form.controls.direccion">
  </app-input-field>

  <app-input-field
    label="Teléfono"
    [control]="form.controls.telefono">
  </app-input-field>

    <div class="actions">
      <app-button
        label="Cancelar"
        color="primary"
        type="button"
        (clickEvent)="cancel.emit()">
      </app-button>

      <app-button
        label="Guardar"
        type="submit">
      </app-button>
    </div>

  </form>
</app-card>
