<app-card [title]="isEditMode ? 'Editar Préstamo' : 'Registrar Préstamo'">

  <form [formGroup]="form" (ngSubmit)="onSubmit()">

    @if (isCreateMode) {
      <app-select-field
        label="Usuario"
        [options]="usuarios"
        valueKey="id"
        labelKey="nombre"
        [control]="form.controls.usuario">
      </app-select-field>

      <app-select-field
        label="Libro"
        [options]="libros"
        valueKey="id"
        labelKey="titulo"
        [control]="form.controls.libro">
      </app-select-field>
    }

    @if (isEditMode) {
      <div class="card-info">
        <strong>Usuario:</strong>
        <span>{{ loan?.user }}</span>

        <strong>Libro:</strong>
        <span>{{ loan?.book }}</span>
      </div>
    }

    <app-datepicker-field
      label="Fecha límite de devolución"
      [control]="form.controls.fechaLimiteDevolucion">
    </app-datepicker-field>

    <app-text-area
      label="Observaciones"
      [control]="form.controls.observacion"
      [rows]="4">
    </app-text-area>

    <div class="actions">
      <app-button
        label="Cancelar"
        type="button"
        (clickEvent)="cancel.emit()">
      </app-button>

      <app-button
        label="Guardar"
        type="submit"
        [disabled]="form.invalid">
      </app-button>
    </div>

  </form>
</app-card>
