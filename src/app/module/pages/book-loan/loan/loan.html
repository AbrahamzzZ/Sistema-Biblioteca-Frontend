<h1>Registrar Préstamo</h1>

<div class="actions">
  <app-button
    label="Registrar préstamo"
    icon="add"
    color="primary"
    (clickEvent)="onCreateLoan()">
  </app-button>
</div>

@if (showLoanModal) {
  <app-modal (close)="closeLoanModal()">
    <app-form
      [usuarios]="usuarios"
      [libros]="libros"
      mode="create"
      (cancel)="closeLoanModal()"
      (save)="onSaveLoan($event)">
    </app-form>
  </app-modal>
}
