<h1>Gestión de Préstamos</h1>

<div class="stats-container">
  <app-stat-card
    title="Total Préstamos"
    icon="people">
  </app-stat-card>

  <app-stat-card
    title="Devueltos"
    icon="check_circle">
  </app-stat-card>

  <app-stat-card
    title="Activos"
    icon="import_contacts">
  </app-stat-card>

  <app-stat-card
    title="Vencidos"
    icon="warning">
  </app-stat-card>
</div>

<div class="actions">
  <app-search-bar
    [options]="searchOptions"
    (search)="onSearch($event)">
  </app-search-bar>

  <app-button
    label="Registrar préstamo"
    icon="add"
    color="primary"
    (clickEvent)="onCreateLoan()"
    >
  </app-button>
</div>

<app-data-table
  [columns]="columns"
  [data]="filteredLoans"
  (edit)="onEditLoan($event)"
  (delete)="onAskDelete($event)">
</app-data-table>

@if(showDeleteDialog){
  <app-dialog
    title="Eliminar usuario"
    message="¿Deseas dar de baja este préstamo?"
    (confirm)="confirmDelete()"
    (cancelDelete)="cancelDelete()">
  </app-dialog>
}

@if(showUserModal){
  <app-modal
    (close)="closeLoanModal()">

    <app-form
      [loan]="editingLoan"
      (cancel)="closeLoanModal()"
      (save)="onSaveLoan($event)">
    </app-form>

  </app-modal>
}
