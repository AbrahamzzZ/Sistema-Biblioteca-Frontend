<h1>Gestión de Libros</h1>

<div class="stats-container">
  <app-stat-card
    title="Libros totales"
    [count]="books.length"
    icon="menu_book">
  </app-stat-card>

  <app-stat-card
    title="Libros activos"
    [count]="librosActivos"
    icon="check_circle">
  </app-stat-card>

  <app-stat-card
    title="Sin stock"
    [count]="librosSinStock"
    icon="remove_circle">
  </app-stat-card>

  <app-stat-card
    title="Stock total"
    [count]="stockTotal"
    icon="inventory">
  </app-stat-card>
</div>

<div class="actions">
  <app-search-bar
    [options]="searchOptions"
    (search)="onSearch($event)">
  </app-search-bar>

  <app-button
    label="Registrar libro"
    icon="add"
    color="primary"
    (clickEvent)="onCreateBook()">
  </app-button>
</div>

<div class="content">
  @for(book of filteredBooks; track book.id){
    <app-book-card
      class="card"
      [book]="book"
      (edit)="onEditBook($event)"
      (toggle)="onAskToggle($event)">
    </app-book-card>
  }
</div>

@if(showConfirmDialog){
  <app-dialog
    [title]="dialogTitle"
    [message]="dialogMessage"
    [itemName]="selectedBook?.titulo"
    (confirm)="confirmToggle()"
    (cancelDelete)="cancelDialog()">
  </app-dialog>
}

@if(showBookModal){
  <app-modal
    [title]="editingBook ? 'Editar libro' : 'Registrar libro'"
    (close)="closeBookModal()">

    <app-form
      [book]="editingBook"
      (save)="onSaveBook($event)"
      (cancel)="closeBookModal()">
    </app-form>

  </app-modal>
}
