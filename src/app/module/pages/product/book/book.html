<h1>Gestión de Libros</h1>

<div class="stats-container">
  <app-stat-card
    title="Libros totales"
    [count]="books.length"
    icon="people">
  </app-stat-card>

  <app-stat-card
    title="Libros activos"
    [count]="filteredBooks.length"
    icon="check_circle">
  </app-stat-card>
</div>

<div class="actions">
  <app-search-bar
    [options]="searchOptions"
    (search)="onSearch($event)">
  </app-search-bar>

  <app-button
    label="Registrar libro"
    icon="add"
    color="primary"
    (clickEvent)="onCreateBook()"
    >
  </app-button>
</div>

<div class="content">
  @for(book of filteredBooks; track $index){
    <app-book-card class="card"
      [book]="book"
      (edit)="onEditBook($event)"
      (delete)="onAskDelete($event)">
    </app-book-card>
  }
</div>

@if(showDeleteDialog){
  <app-dialog
    title="Eliminar libro"
    message="¿Deseas eliminar el libro?"
    [itemName]="selectedBook?.name"
    (confirm)="confirmDelete()"
    (cancelDelete)="cancelDelete()">
  </app-dialog>
}

@if(showBookModal){
  <app-modal
    [title]="editingBook ? 'Editar libro' : 'Registrar libro'"
    (close)="closeBookModal()">

    <app-form
      [book]="editingBook"
      (save)="onSaveBook($event)"
      (cancel)="closeBookModal()">
    </app-form>

  </app-modal>
}
